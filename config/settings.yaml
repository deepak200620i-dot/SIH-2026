detection:
  model_path: models/yolo26n.pt
  confidence: 0.35
  iou_threshold: 0.45
  target_classes:
  - person
  - car
  - truck
  - bus
  - motorcycle
  - bicycle
  device: ''
  img_size: 640
video:
  source: data/videos/test.mp4
  max_fps: 30
  max_processing_dimension: 960
tracking:
  tracker: bytetrack.yaml
fence:
  cooldown_seconds: 20.0
  zones:
  - name: test_zone
    polygon:
    - - 0
      - 0
    - - 100
      - 0
    - - 100
      - 100
    - - 0
      - 100
    severity: critical
face:
  gallery_path: data/faces
  similarity_threshold: 0.6
  model_name: buffalo_l
  det_size:
  - 640
  - 640
  gpu_id: -1
  min_face_size: 20
weapon_detection:
  enabled: true
  model_path: models/weapon_detector.pt
  confidence: 0.45
  iou_threshold: 0.45
  img_size: 640
  weapon_labels:
  - gun
  - pistol
  - rifle
  - assault_rifle
  - sniper_rifle
  - submachine_gun
  - machine_gun
  - rocket_launcher
  - rocketlauncher
  - rpg
  - missile_launcher
  - mortar
  - grenade
  - knife
  - military_weapon
events:
  cooldown_seconds: 30
  evidence_path: data/evidence
  db_path: data/ibvap.db
anpr:
  languages:
  - en
  min_confidence: 0.4
  vehicle_classes:
  - car
  - truck
  - bus
  - motorcycle
  gpu: false
loitering:
  threshold_seconds: 60.0
  cooldown_seconds: 30.0
cameras:
  default_camera_id: cam_01
  default_camera_name: Border Gate Alpha
  default_camera_source: data/videos/test.mp4
behavior_analytics:
  direction_enabled: true
  min_displacement_px: 30
  angle_tolerance_deg: 45
  zone_permitted_directions: {}
  repeated_entry_enabled: true
  max_entries: 3
  entry_window_minutes: 30
  crowding_enabled: true
  max_persons_per_zone: 5
  rapid_movement_enabled: true
  max_speed_px_per_sec: 200
  abnormal_dwell_enabled: true
  excessive_dwell_multiplier: 3.0
  base_dwell_seconds: 60
  cooldown_seconds: 30.0
